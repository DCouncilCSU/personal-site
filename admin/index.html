<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Admin - Manage Posts</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>

<body>
  <div class="admin-container">

    <!-- Form Section -->
    <div class="admin-card" id="form-card">
      <div class="admin-title">
        <span id="form-heading">[+] Create New Post</span>
        <a href="/" class="btn-secondary" style="text-decoration:none;">&larr; View Live Site</a>
      </div>

      <div id="editing-alert" class="editing-banner">
        <span>Editing <strong id="editing-post-id"></strong></span>
        <button type="button" class="btn btn-secondary" id="cancel-edit-btn"
          style="padding: 0.2rem 0.5rem; font-size: 0.75rem;">Cancel Edit (New Post)</button>
      </div>

      <form id="post-form">
        <input type="hidden" id="editing-id" value="">

        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" required placeholder="e.g. Ambient Sessions / Vol. 1">
        </div>

        <div class="row">
          <div class="form-group">
            <label for="tags">Tags</label>
            <input type="text" id="tags" placeholder="audio, ambient, soundcloud">
            <span class="hint">Comma-separated</span>
          </div>
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
              <label for="date" style="margin-bottom: 0;">Date</label>
              <button type="button" id="toggle-date-lock" class="btn btn-secondary"
                style="padding: 0.1rem 0.4rem; font-size: 0.7rem; height: auto;" title="Unlock to change date">
                &#128274; Locked
              </button>
            </div>
            <input type="date" id="date" readonly>
            <span class="hint" id="date-hint">Locked to prevent accidental reordering</span>
          </div>
        </div>

        <div class="form-group">
          <label for="summary">Summary</label>
          <input type="text" id="summary" placeholder="One-line summary for preview card...">
        </div>

        <div class="form-group">
          <label for="coverImage">Cover Image URL (optional)</label>
          <input type="text" id="coverImage" placeholder="/assets/sample-artwork.svg or empty">
        </div>

        <div class="form-group">
          <label for="content">Content</label>
          <textarea id="content" rows="6" placeholder="Write full text or post notes here..."></textarea>
        </div>

        <div class="form-group">
          <label>External Links</label>
          <div id="links-container"></div>
          <button type="button" class="btn btn-secondary" id="add-link-btn" style="margin-top:0.3rem;">+ Add
            Link</button>
        </div>

        <div class="actions">
          <button type="submit" class="btn" id="submit-btn">Append Post to posts.json</button>
          <button type="button" class="btn btn-secondary" id="reset-btn">Reset Form</button>
        </div>
      </form>

      <div id="status-box" class="status-msg"></div>
    </div>

    <!-- Manage Existing Posts Section -->
    <div class="admin-card">
      <div class="admin-title">
        <span>[&equiv;] Existing Entries in posts.json (<span id="post-count">0</span>)</span>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <button type="button" class="btn btn-secondary" id="sync-sc-btn"
            title="Fetch tracks created in the last 30 days from your SoundCloud profile">
            &#9835; Sync SoundCloud Tracks
          </button>
          <button type="button" class="btn btn-secondary" id="refresh-posts-btn">&#x21bb; Reload</button>
        </div>
      </div>

      <div style="overflow-x: auto;">
        <table class="posts-table">
          <thead>
            <tr>
              <th style="width: 80px;">ID</th>
              <th style="width: 100px;">Date</th>
              <th>Title</th>
              <th style="width: 120px;">Tags</th>
              <th style="width: 120px;">Actions</th>
            </tr>
          </thead>
          <tbody id="posts-list-body">
            <tr>
              <td colspan="5" style="text-align: center; color: var(--text-muted);">Loading posts...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let currentPosts = [];

    const form = document.getElementById('post-form');
    const formHeading = document.getElementById('form-heading');
    const editingIdInput = document.getElementById('editing-id');
    const editingAlert = document.getElementById('editing-alert');
    const editingPostIdSpan = document.getElementById('editing-post-id');
    const cancelEditBtn = document.getElementById('cancel-edit-btn');
    const submitBtn = document.getElementById('submit-btn');
    const statusBox = document.getElementById('status-box');
    const linksContainer = document.getElementById('links-container');
    const addLinkBtn = document.getElementById('add-link-btn');
    const postsListBody = document.getElementById('posts-list-body');
    const postCountSpan = document.getElementById('post-count');
    const refreshPostsBtn = document.getElementById('refresh-posts-btn');
    const resetBtn = document.getElementById('reset-btn');
    const dateInput = document.getElementById('date');
    const toggleDateLockBtn = document.getElementById('toggle-date-lock');
    const dateHint = document.getElementById('date-hint');

    function setDateLock(locked) {
      dateInput.readOnly = locked;
      if (locked) {
        toggleDateLockBtn.innerHTML = '&#128274; Locked';
        toggleDateLockBtn.title = 'Unlock to change date';
        dateHint.textContent = 'Locked to prevent accidental reordering';
      } else {
        toggleDateLockBtn.innerHTML = '&#128275; Unlocked';
        toggleDateLockBtn.title = 'Lock date field';
        dateHint.textContent = 'Unlocked: editing date will reorder posts';
      }
    }

    toggleDateLockBtn.addEventListener('click', () => {
      setDateLock(!dateInput.readOnly);
    });

    dateInput.addEventListener('click', () => {
      if (dateInput.readOnly) {
        dateInput.blur();
      }
    });

    // Default date to today
    function resetFormState() {
      form.reset();
      editingIdInput.value = '';
      editingAlert.style.display = 'none';
      formHeading.textContent = '[+] Create New Post';
      submitBtn.textContent = 'Append Post to posts.json';
      dateInput.value = new Date().toISOString().slice(0, 10);
      setDateLock(true);
      linksContainer.innerHTML = '';
      statusBox.className = 'status-msg';
    }

    resetFormState();

    function createLinkRow(type = 'github', label = '', url = '') {
      const row = document.createElement('div');
      row.className = 'link-row';
      row.innerHTML = `
        <select class="link-type">
          <option value="github"${type === 'github' ? ' selected' : ''}>GitHub</option>
          <option value="soundcloud"${type === 'soundcloud' ? ' selected' : ''}>SoundCloud</option>
          <option value="demo"${type === 'demo' ? ' selected' : ''}>Demo / Live</option>
          <option value="external"${type === 'external' ? ' selected' : ''}>External</option>
        </select>
        <input type="text" class="link-label" placeholder="Button Label" value="${escapeHtml(label)}">
        <input type="text" class="link-url" placeholder="https://..." value="${escapeHtml(url)}">
        <button type="button" class="btn btn-danger remove-link" title="Remove">&times;</button>
      `;
      row.querySelector('.remove-link').addEventListener('click', () => row.remove());
      return row;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    addLinkBtn.addEventListener('click', () => {
      linksContainer.appendChild(createLinkRow());
    });

    cancelEditBtn.addEventListener('click', resetFormState);
    resetBtn.addEventListener('click', resetFormState);

    // Fetch and render existing posts
    async function loadPosts() {
      try {
        const res = await fetch('/api/posts?_t=' + Date.now());
        if (!res.ok) throw new Error('Could not load posts.json');
        currentPosts = await res.json();
        renderPostsTable();
      } catch (err) {
        postsListBody.innerHTML = `<tr><td colspan="5" style="color:#ef4444; text-align:center;">Failed to load posts: ${err.message}</td></tr>`;
      }
    }

    function renderPostsTable() {
      postCountSpan.textContent = currentPosts.length;
      if (currentPosts.length === 0) {
        postsListBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No entries in posts.json</td></tr>`;
        return;
      }

      postsListBody.innerHTML = currentPosts.map(post => {
        const tags = (post.tags || []).join(', ');
        return `
          <tr data-id="${post.id}">
            <td><span class="post-id-badge">${post.id}</span></td>
            <td style="font-family: var(--font-mono); font-size: 0.8rem;">${post.date || ''}</td>
            <td><strong>${escapeHtml(post.title)}</strong></td>
            <td style="font-size: 0.75rem; color: var(--text-muted);">${escapeHtml(tags)}</td>
            <td>
              <div class="table-actions">
                <button type="button" class="btn btn-edit" onclick="startEditPost('${post.id}')">Edit</button>
                <button type="button" class="btn btn-danger" onclick="deletePost('${post.id}')">Delete</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Populate form with post data for editing
    window.startEditPost = function (postId) {
      const post = currentPosts.find(p => p.id === postId);
      if (!post) return;

      editingIdInput.value = post.id;
      document.getElementById('title').value = post.title || '';
      document.getElementById('date').value = post.date || '';
      document.getElementById('tags').value = (post.tags || []).join(', ');
      document.getElementById('summary').value = post.summary || '';
      document.getElementById('coverImage').value = post.coverImage || '';
      document.getElementById('content').value = post.content || '';

      // Links
      linksContainer.innerHTML = '';
      if (Array.isArray(post.links)) {
        post.links.forEach(l => {
          linksContainer.appendChild(createLinkRow(l.type, l.label, l.url));
        });
      }

      formHeading.textContent = `[~] Edit Post (${post.id})`;
      editingPostIdSpan.textContent = `${post.id} - "${post.title}"`;
      editingAlert.style.display = 'flex';
      submitBtn.textContent = `Save Changes to ${post.id}`;

      // Scroll to form
      document.getElementById('form-card').scrollIntoView({ behavior: 'smooth' });
    };

    // Delete post
    window.deletePost = async function (postId) {
      const post = currentPosts.find(p => p.id === postId);
      const title = post ? post.title : postId;
      if (!confirm(`Are you sure you want to permanently delete "${title}" (${postId}) from posts.json?`)) {
        return;
      }

      try {
        const res = await fetch(`/api/posts/${postId}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Delete failed');

        statusBox.className = 'status-msg success';
        statusBox.innerHTML = `&check; Post <strong>${postId}</strong> deleted successfully.`;

        if (editingIdInput.value === postId) {
          resetFormState();
        }

        await loadPosts();
      } catch (err) {
        statusBox.className = 'status-msg error';
        statusBox.textContent = `Failed to delete post: ${err.message}`;
      }
    };

    // Form submit (handles both Create and Update)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusBox.className = 'status-msg';
      submitBtn.disabled = true;

      const editingId = editingIdInput.value;
      const isEditing = Boolean(editingId);

      // Collect links
      const links = [];
      document.querySelectorAll('.link-row').forEach(row => {
        const type = row.querySelector('.link-type').value;
        const label = row.querySelector('.link-label').value.trim();
        const url = row.querySelector('.link-url').value.trim();
        if (label && url) {
          links.push({ type, label, url });
        }
      });

      const payload = {
        title: document.getElementById('title').value,
        date: document.getElementById('date').value,
        tags: document.getElementById('tags').value,
        summary: document.getElementById('summary').value,
        coverImage: document.getElementById('coverImage').value || null,
        content: document.getElementById('content').value,
        links: links
      };

      const endpoint = isEditing ? `/api/posts/${editingId}` : '/api/posts';
      const method = isEditing ? 'PUT' : 'POST';

      try {
        const res = await fetch(endpoint, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Failed to save');
        }

        statusBox.className = 'status-msg success';
        statusBox.innerHTML = isEditing
          ? `&check; Successfully updated <strong>${data.post.id}</strong> ("${data.post.title}")!`
          : `&check; Successfully created <strong>${data.post.id}</strong> ("${data.post.title}")!`;

        resetFormState();
        await loadPosts();
      } catch (err) {
        statusBox.className = 'status-msg error';
        statusBox.textContent = `Error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    });

    refreshPostsBtn.addEventListener('click', loadPosts);

    // Sync tracks from SoundCloud
    const syncScBtn = document.getElementById('sync-sc-btn');
    syncScBtn.addEventListener('click', async () => {
      if (syncScBtn.disabled) return;
      const origText = syncScBtn.textContent;
      syncScBtn.disabled = true;
      syncScBtn.textContent = 'Syncing...';
      statusBox.className = 'status-msg';

      try {
        const res = await fetch('/api/soundcloud/sync', { method: 'POST' });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Failed to sync tracks');
        }

        statusBox.className = 'status-msg success';
        if (data.addedCount > 0) {
          statusBox.innerHTML = `&check; Synced SoundCloud! Added <strong>${data.addedCount}</strong> new track(s) from the last 30 days to <code>posts.json</code>.`;
        } else {
          statusBox.innerHTML = `&check; SoundCloud is up to date (${data.last30DaysCount} track(s) in last 30 days, 0 new additions).`;
        }
        await loadPosts();
      } catch (err) {
        statusBox.className = 'status-msg error';
        statusBox.textContent = `SoundCloud Sync Error: ${err.message}`;
      } finally {
        syncScBtn.disabled = false;
        syncScBtn.textContent = origText;
      }
    });

    // Initial load
    loadPosts();
  </script>
</body>

</html>
