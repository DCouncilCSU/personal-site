<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .stroke-main { stroke: #18181b; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-detail { stroke: #18181b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Green Crewneck Collar & Shoulders (Bust anchor) -->
  <g id="bust">
    <!-- Green Shirt Top -->
    <path d="M 40 188 
             C 42 165 62 155 76 150 
             C 86 156 114 156 124 150 
             C 138 155 158 165 160 188 
             Z" 
          fill="#16a34a" class="stroke-main"/>

    <!-- Collar Rim -->
    <path d="M 76 150 C 86 160 114 160 124 150" fill="none" class="stroke-main"/>

    <!-- Neck -->
    <path d="M 85 130 L 85 152 C 95 155 105 155 115 152 L 115 130 Z" 
          fill="#fed7aa" class="stroke-main"/>
  </g>

  <!-- Head & Face -->
  <g id="head">
    <!-- Ears -->
    <ellipse cx="61" cy="98" rx="6" ry="11" fill="#fed7aa" class="stroke-main"/>
    <ellipse cx="139" cy="98" rx="6" ry="11" fill="#fed7aa" class="stroke-main"/>
    <path d="M 61 95 Q 64 99 61 103" fill="none" class="stroke-detail"/>
    <path d="M 139 95 Q 136 99 139 103" fill="none" class="stroke-detail"/>

    <!-- Face Base (Elongated, gentle taper down to chin) -->
    <path d="M 70 65 
             C 62 82 63 118 72 134 
             C 80 148 120 148 128 134 
             C 137 118 138 82 130 65 
             C 122 50 78 50 70 65 Z" 
          fill="#fed7aa" class="stroke-main"/>

    <!-- Eyes (Forward gaze, brown iris with catchlight) -->
    <!-- Left Eye -->
    <ellipse cx="85" cy="88" rx="6" ry="5.5" fill="#ffffff" class="stroke-detail"/>
    <circle cx="86" cy="88" r="3.2" fill="#262626"/>
    <circle cx="87" cy="86.8" r="1.2" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="115" cy="88" rx="6" ry="5.5" fill="#ffffff" class="stroke-detail"/>
    <circle cx="114" cy="88" r="3.2" fill="#262626"/>
    <circle cx="115" cy="86.8" r="1.2" fill="#ffffff"/>

    <!-- Straight, Flat, Expressive Dark Eyebrows -->
    <path d="M 74 76 Q 85 75 93 78" fill="none" stroke="#18181b" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 107 78 Q 115 75 126 76" fill="none" stroke="#18181b" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Long Sculptural Nose -->
    <path d="M 97 78 L 96 112 Q 100 116 104 112 L 103 105" 
          fill="none" stroke="#18181b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Subtle Cheek Stubble Stippling -->
    <g id="stubble" fill="#262626">
      <!-- Left cheek & jaw stipple dots -->
      <circle cx="74" cy="114" r="0.85"/>
      <circle cx="78" cy="110" r="0.75"/>
      <circle cx="82" cy="115" r="0.8"/>
      <circle cx="75" cy="122" r="0.75"/>
      <circle cx="80" cy="124" r="0.85"/>
      <circle cx="76" cy="130" r="0.8"/>
      <circle cx="82" cy="132" r="0.75"/>
      <circle cx="84" cy="126" r="0.7"/>

      <!-- Right cheek & jaw stipple dots -->
      <circle cx="126" cy="114" r="0.85"/>
      <circle cx="122" cy="110" r="0.75"/>
      <circle cx="118" cy="115" r="0.8"/>
      <circle cx="125" cy="122" r="0.75"/>
      <circle cx="120" cy="124" r="0.85"/>
      <circle cx="124" cy="130" r="0.8"/>
      <circle cx="118" cy="132" r="0.75"/>
      <circle cx="116" cy="126" r="0.7"/>
    </g>

    <!-- Goatee & Mustache (Neat, compact, focused around chin & mouth) -->
    <!-- Chin Goatee -->
    <path d="M 86 122 
             C 86 138 91 146 100 146 
             C 109 146 114 138 114 122 
             C 111 127 107 129 100 129 
             C 93 129 89 127 86 122 Z" 
          fill="#262626" class="stroke-main"/>

    <!-- Trimmed Mustache -->
    <path d="M 88 117 Q 100 114 112 117 Q 100 121 88 117 Z" fill="#262626" class="stroke-detail"/>

    <!-- Soul Patch -->
    <polygon points="98,128 102,128 100,133" fill="#262626"/>

    <!-- Mouth -->
    <path d="M 91 123 Q 100 125 109 123" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Subtle lower lip shadow -->
    <path d="M 95 127 Q 100 128 105 127" fill="none" stroke="#e0a07e" stroke-width="2" stroke-linecap="round"/>

    <!-- Dark Shaggy Hair (Frontal bangs swept across forehead) -->
    <path d="M 64 80 
             C 58 52 70 28 100 28 
             C 130 28 142 52 136 80 
             C 142 86 141 106 135 112 
             C 133 98 135 84 131 76 
             C 126 62 118 64 110 68 
             C 102 72 90 62 78 68 
             C 72 73 69 90 65 112 
             C 59 106 58 86 64 80 Z" 
          fill="#18181b" class="stroke-main"/>

    <!-- Hair Texture / Swept Bangs Details -->
    <path d="M 80 44 Q 96 36 112 40" fill="none" stroke="#3f3f46" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 92 50 Q 108 44 124 48" fill="none" stroke="#3f3f46" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 74 58 Q 86 52 98 56" fill="none" stroke="#3f3f46" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
